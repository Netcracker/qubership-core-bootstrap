name: '[Multi-Module] Go code coverage analysis'

on:
  push:
    branches:
      - main
    paths:
      - 'core-bootstrap/**'
      - 'cr-synchronizer/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'core-bootstrap/**'
      - 'cr-synchronizer/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-code-coverage-analysis-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sonar-analysis:
    name: Measure code coverage and upload to SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          cache: true
          cache-dependency-path: "**/*.sum"
          go-version: '1.27'

      - name: Run tests with coverage for core-bootstrap
        working-directory: core-bootstrap
        run: |
          go test -v -coverprofile=coverage.out ./... || true

      - name: Run tests with coverage for cr-synchronizer
        working-directory: cr-synchronizer
        run: |
          go test -v -coverprofile=coverage.out ./... || true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_CORE_BOOTSTRAP }}