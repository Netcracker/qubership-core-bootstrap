{{- /*
  Per-namespace Secret RBAC for dbaas-operator. The operator ClusterRole has no secrets
  permission; DatabaseSecretClaim and ExternalDatabase need get/create/update/patch here.
  The RoleBinding subject is the operator ServiceAccount in the aggregator namespace,
  derived from API_DBAAS_ADDRESS (http://dbaas-aggregator.<ns>:8080 → <ns>).
*/ -}}
{{- $addr := .Values.API_DBAAS_ADDRESS | default "" }}
{{- if $addr }}
{{- $host := first (splitList ":" (last (splitList "://" $addr))) }}
{{- $parts := splitList "." $host }}
{{- if ge (len $parts) 2 }}
{{- $operatorNamespace := index $parts 1 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbaas-operator-secrets
  namespace: {{ .Values.NAMESPACE }}
  labels:
    app.kubernetes.io/instance: "{{ .Values.SERVICE_NAME }}"
    app.kubernetes.io/part-of: Cloud-Core
    app.kubernetes.io/managed-by: "helm"
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
rules:
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs: [ get, create, update, patch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbaas-operator-secrets
  namespace: {{ .Values.NAMESPACE }}
  labels:
    app.kubernetes.io/instance: "{{ .Values.SERVICE_NAME }}"
    app.kubernetes.io/part-of: Cloud-Core
    app.kubernetes.io/managed-by: "helm"
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbaas-operator-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Values.DBAAS_OPERATOR_SERVICE_NAME | default "dbaas-operator" }}
    namespace: {{ $operatorNamespace }}
{{- end }}
{{- end }}
