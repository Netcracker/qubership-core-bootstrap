{{- if include "consulacl.enabled" . }}
{{- $compositeId := default .Values.ORIGIN_NAMESPACE .Values.BASELINE_ORIGIN }}
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: cloud-core
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "consulacl.operatorNamespace" . | quote }}
  acl:
    name: cloud-core
    explicitName: true
    json: >
      {
         "policies":[
            {
               "Name":"{{ .Values.NAMESPACE }}_read_global_v2",
               "Description":"{{ .Values.NAMESPACE }}_read_global prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/application/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_write_global_v2",
               "Description":"{{ .Values.NAMESPACE }}_write_global prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/application/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_global_shared_v2",
               "Description":"{{ .Values.NAMESPACE }}_global_shared prefix policy",
               "Rules":"key_prefix \"data/{{ .Values.NAMESPACE }}/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_sessions_v2",
               "Description":"{{ .Values.NAMESPACE }}_sessions session policy",
               "Rules":"session_prefix \"\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.ORIGIN_NAMESPACE }}_read_bluegreen_v2",
               "Description":"{{ .Values.ORIGIN_NAMESPACE }}_read_bluegreen prefix policy",
               "Rules":"key_prefix \"bluegreen/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_read_composite_v2",
               "Description":"{{ .Values.NAMESPACE }}_read_composite prefix policy",
               "Rules":"key_prefix \"composite/{{ $compositeId }}/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_write_composite_v2",
               "Description":"{{ .Values.NAMESPACE }}_write_composite prefix policy",
               "Rules":"key_prefix \"composite/{{ $compositeId }}/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_composite_write_global_v2",
               "Description":"{{ .Values.NAMESPACE }}_composite_write_global prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/application/composite/\" { policy = \"write\" }"
            }
         ],
         "roles":[],
         "bind_rules":[
            {
               "AuthMethod": "applications-k8s-m2m",
               "BindName":"{{ .Values.NAMESPACE }}_${value.serviceaccount}_v2",
               "Selector": "value.namespace == \"{{ .Values.NAMESPACE }}\" and value.serviceaccount != \"default\"",
               "ServiceAccountName": "${value.serviceaccount}"
            }
         ]
      }

---
apiVersion: netcracker.com/v1
kind: ConsulKV
metadata:
  name: cloud-core
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "consulacl.operatorNamespace" . | quote }}
  purgeOnDelete: true
  kv:
    - key: "config/{{ .Values.NAMESPACE }}/application/"
    - key: "data/{{ .Values.NAMESPACE }}/"
{{- end }}
