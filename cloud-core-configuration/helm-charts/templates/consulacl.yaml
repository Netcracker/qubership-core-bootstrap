{{- if and (eq (toString .Values.CONSUL_ENABLED) "true") (include "coretpl.consulAclEnabled" $) }}
---
# Grants every ServiceAccount of the namespace read access to the configs and logging settings of the
# namespace in Consul, for a login with the auth method applications-k8s-m2m. A service that writes to Consul
# gets that access from a ConsulACL of its own chart.
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: cloud-core
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/part-of: Cloud-Core
    app.kubernetes.io/managed-by: helm
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  operatorNamespace: {{ include "coretpl.consulNamespace" $ | quote }}
  acl:
    name: cloud-core
    json: >
      {
        "policies": [
          {"Name": "config-read", "Rules": "key_prefix \"config/{{ .Values.NAMESPACE }}/\" { policy = \"read\" }"},
          {"Name": "logging-read", "Rules": "key_prefix \"logging/{{ .Values.NAMESPACE }}/\" { policy = \"read\" }"}
        ],
        "roles": [{"Name": "core-service", "policy_names": ["config-read", "logging-read"]}],
        "bind_rules": [{"BindName": "core-service", "Selector": "value.namespace == \"{{ .Values.NAMESPACE }}\""}]
      }
{{- end }}
