# The waypoint of the core namespace, as the core-mesh-config chart will own it: the Gateway alone,
# with the chart's name, label and listener, and the Helm ownership metadata of its release, so the
# release adopts it. Applied by enable-early-core-mesh (utils/early-mesh.mk), which fills in the
# ${...} placeholders and the namespace.
#
# Helm 4 adopts with a server-side apply, which refuses to change a field another manager set to a
# different value. So nothing here may differ from the chart: no pod options (the chart brings its
# own ConfigMap and points the Gateway to it), and the waypoint runs with the Istio default size
# until the chart is installed.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${WAYPOINT_NAME}
  labels:
    istio.io/waypoint-for: service
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: ${RELEASE_NAME}
    meta.helm.sh/release-namespace: ${RELEASE_NAMESPACE}
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
