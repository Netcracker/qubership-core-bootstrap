{{/* Consul access of a core-based microservice: its ConsulACL and ConsulKV */}}

{{ define "coretpl.bootstrap.hooks" }}

{{ $currentScope := .values }}

{{- with $currentScope }}
{{- $disabled := eq (toString .Values.CORE_TPL_MS_CONSULACL_ENABLED) "false" -}}
{{- if and (include "coretpl.consulacl.enabled" .) (not $disabled) }}
{{- $compositeId := default .Values.ORIGIN_NAMESPACE .Values.BASELINE_ORIGIN }}
---
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "coretpl.consulacl.operatorNamespace" . | quote }}
  acl:
    name: {{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}
    explicitName: true
    json: >
      {
         "policies":[
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_global_shared_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_global_shared prefix policy",
               "Rules":"key_prefix \"data/{{ .Values.NAMESPACE }}/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_global_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_global prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/application/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_sessions_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_sessions session policy",
               "Rules":"session_prefix \"\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.ORIGIN_NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_bluegreen_v2",
               "Description":"{{ .Values.ORIGIN_NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_bluegreen prefix policy",
               "Rules":"key_prefix \"bluegreen/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_composite_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_composite prefix policy",
               "Rules":"key_prefix \"composite/{{ $compositeId }}/\" { policy = \"read\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }} prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging prefix policy",
               "Rules":"key_prefix \"logging/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/\" { policy = \"read\" }"
            }
         ],
         "roles":[
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }} role",
               "policy_names":[
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_global_shared_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging_v2",
                  "{{ .Values.ORIGIN_NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_bluegreen_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_composite_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_read_global_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_sessions_v2"
               ]
            }
         ]
      }
---
apiVersion: netcracker.com/v1
kind: ConsulKV
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "coretpl.consulacl.operatorNamespace" . | quote }}
  kv:
    - key: "config/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
    - key: "data/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
    - key: "logging/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
{{- end }}

{{- end }}
{{- end }}
